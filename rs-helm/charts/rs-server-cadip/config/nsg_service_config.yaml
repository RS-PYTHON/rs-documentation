nsg:
  auth:
    type: TokenAuth
    auth_uri: https://PLACEHOLDER/keycloak/realms/PLACEHOLDER/protocol/openid-connect/token
    token_type: json
    token_key: access_token
    refresh_token_key: refresh_token
    token_expiration_key: expires_in
    request_method: POST
    req_data:
      client_id: PLACEHOLDER
      client_secret: PLACEHOLDER
      grant_type: PLACEHOLDER
      username: PLACEHOLDER
      password: PLACEHOLDER
    credentials:
      empty: value
    headers:
      Content-Type: application/x-www-form-urlencoded
  products:
    S1_SAR_RAW:
      productType: RAW
      collection: Sentinel1

  search:
    type: ODataV4Search
    api_endpoint: '{{ $.Values.app.station.nsg.endpoint }}/Files'
    need_auth: true
    results_entry: $.value
    metadata_mapping:
      id:
        - null
        - '$.Id'
      Name:
        - null
        - '$.Name'
      SessionIds:
        - null
        - '$.SessionId'
      SessionId:
        - null
        - '$.SessionId'
      Channel:
        - null
        - '$.Channel'
      BlockNumber:
        - null
        - '$.BlockNumber'
      FinalBlock:
        - null
        - '$.FinalBlock'
      PublicationDate:
        - null
        - '$.PublicationDate'
      EvictionDate:
        - null
        - '$.EvictionDate'
      Size:
        - null
        - '$.Size'
      Retransfer:
        - null
        - '$.Retransfer'
      StartPublicationDate:
        - null
        - $.PublicationDate
      StopPublicationDate:
        - null
        - $.PublicationDate
      href:
        - null
        - '{{ $.Values.app.station.nsg.endpoint }}/Files({id})/$value'
      geometry: 'POLYGON((180 -90, 180 90, -180 90, -180 -90, 180 -90))'
      downloadLink: '{{ $.Values.app.station.nsg.endpoint }}/Files({id})/$value'
      title: '$.Name'

    free_text_search_operations:
      $filter:
        union: ' OR '
        operations:
          and:
            - 'SessionId in ({SessionIds})'
            - 'SessionId eq {SessionId}'
            - PublicationDate gt {StartPublicationDate#to_iso_utc_datetime}
            - PublicationDate lt {StopPublicationDate#to_iso_utc_datetime}
            - PublicationDate eq {PublicationDate#to_iso_utc_datetime}
            - "Retransfer eq {Retransfer}"

    pagination:
      max_items_per_page: 100
      next_page_url_tpl: '{url}?{search}&$top={items_per_page}&$skip={skip}'
      total_items_nb_key_path: '$.total'

    sort:
      sort_by_tpl: '&$orderby={sort_param} {sort_order}'
      sort_param_mapping:
        datetime: PublicationDate
      sort_order_mapping:
        ascending: asc
        descending: desc
      max_sort_params: 1

  download:
    type: HTTPDownload
    base_uri: '{{ $.Values.app.station.nsg.endpoint }}/Files'
    metadata_mapping:
      uid: '$.Id'
      downloadLink: '{{ $.Values.app.station.nsg.endpoint }}/Files({uid})/$value'

