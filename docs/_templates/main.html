<!-- NOTE: currently we only use dark-themed logos because they are positioned in the header and footer,
 that don't change color when the theme is switched. But if this is updated, white-themed logos are
 available in _static, just replace the src file whenever it's necessary. -->

{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {

      function initCustomMaterial() {

        // ---- SIDEBAR ----
        const sidebarPrimary = document.querySelector(".md-sidebar--primary");
        if (sidebarPrimary && !sidebarPrimary.querySelector(".sidebar-navigation")) {
          const mdNav = sidebarPrimary.querySelector(".md-nav");
          if (mdNav) {
            const navContainer = document.createElement("div");
            navContainer.className = "sidebar-navigation";
            mdNav.parentNode.insertBefore(navContainer, mdNav);
            navContainer.appendChild(mdNav);
          }
        }

        // ---- TABS: logos to the right of the horizontal menu ----
        const tabs = document.querySelector(".md-tabs");
        if (tabs && !tabs.querySelector(".md-tabs-logos")) {

          const tabsLogos = document.createElement("div");
          tabsLogos.className = "md-tabs-logos";

          const tabsLogosData = [
            {src: "{{ base_url }}/_static/EC_NEG.png", dark: "{{ base_url }}/_static/EC_NEG.png", alt: "EU Logo", url: "https://commission.europa.eu/funding-tenders/find-funding/eu-funding-programmes/european-space-programme_en"},
            {src: "{{ base_url }}/_static/copernicus_logo_white.png", dark: "{{ base_url }}/_static/copernicus_logo_white.png", alt: "Copernicus Logo", url: "https://www.copernicus.eu/en"},
            {src: "{{ base_url }}/_static/ESA_logo_white_borderless.png", dark: "{{ base_url }}/_static/ESA_logo_white_borderless.png", alt: "ESA Logo", url: "https://www.esa.int/"}
          ];

          tabsLogosData.forEach(l => {
            const a = document.createElement("a");
            a.href = l.url;
            a.target = "_blank";
            a.className = "md-tabs-logo";

            const img = document.createElement("img");
            img.src = l.src;
            img.alt = l.alt;
            img.setAttribute("data-light-src", l.src);
            img.setAttribute("data-dark-src", l.dark);

            a.appendChild(img);
            tabsLogos.appendChild(a);
          });

          tabs.appendChild(tabsLogos);
        }

        // ---- FOOTER: logos to the right ----
        const footer = document.querySelector(".md-footer");
        if (footer && !footer.querySelector(".footer-logos")) {

          const footerLogos = document.createElement("div");
          footerLogos.className = "footer-logos";

          const logos = [
            {src: "{{ base_url }}/_static/AIRBUS_White.png", dark: "{{ base_url }}/_static/AIRBUS_White.png", alt: "Airbus Logo", url: "https://www.airbus.com/en"},
            {src: "{{ base_url }}/_static/logo_cs_group_white.png", dark: "{{ base_url }}/_static/logo_cs_group_white.png", alt: "CS Group Logo", url: "https://www.csgroup.eu/en/"}
          ];

          logos.forEach(l => {
            const a = document.createElement("a");
            a.href = l.url;
            a.target = "_blank";

            const img = document.createElement("img");
            img.src = l.src; // footer always dark
            img.alt = l.alt;

            a.appendChild(img);
            footerLogos.appendChild(a);
          });

          footer.appendChild(footerLogos);
        }
      }

      /* Initial load */
      initCustomMaterial();

      /* Re-run after internal navigation (SPA) */
      document.addEventListener("md-content-updated", initCustomMaterial);

    });
  </script>
{% endblock %}
