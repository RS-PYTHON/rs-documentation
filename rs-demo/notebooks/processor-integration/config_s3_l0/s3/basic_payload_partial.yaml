general_configuration:
  logging:
    level: DEBUG
  # setup a basic logging configuration
  triggering__use_basic_logging: true
  # Wait before stopping the dask cluster, usefull for localCluster to access the dashboard
  triggering__wait_before_exit: 10
  # Export the dask graph for variables at writing time
  # dask__export_graphs: ./reports/graphs
   # breakpoints: activate intermediate data dump
   # WRITE mode : write the entire outputs EOProducts of the ProcessingUnit in the zarr associated storage
   # FORCE_WRITE mode : Same as WRITE but overload existing breakpoint
   # RETRIEVE mode: replace the computed output of the ProcessingUnit by a disc read product
   # SKIP mode: do nothing

external_modules:
- name : l0.cadu_processing.cadu_store
  nested : true

workflow:
- name: s3_l0_processor
  # Activate or not this unit, if not active its outputs will not be available
  active : true
  # python module to import from
  module: l0.s3.s3_l0_processor
  processing_unit: S3L0Processor
  # input products IDs
  inputs:
    CADUS: S3ACADUS

  outputs:
    ^(?!cache).*: S03ISPS
    cache.*: S03CACHE

  adfs:
    osf: OSF
    fro: FRO

  parameters:
    acquisition_report_output_path: ./S3_D_TDS_1/output/default/Report/
    temporary_path: ./S3_D_TDS_1/output/tmp

I/O:
  # input products descriptions and access parameters
  input_products:
  - id: S3ACADUS
    path: s3://rs-dev-cluster-temp/stations/CADIP/test-l0-develop-2/S3_D_TDS_1/CADUs/S3A_20200121061417020455.short
    store_type: cadu
    store_params:
      # s3_secret_alias: s3_cluster # see secrets.json
      storage_options:
        key: ${S3_ACCESSKEY_CLUSTER}
        secret: ${S3_SECRETKEY_CLUSTER}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT_CLUSTER}
          region_name: ${S3_REGION_CLUSTER}

  adfs:
  - id: OSF
    path: s3://rs-dev-cluster-temp/stations/ADGS/test-l0-develop-2/S3_D_TDS_1/AUX/S3A_AX___OSF_AX_20160216T192404_99991231T235959_20170322T163046___________________EUM_O_AL_001.SEN3/S3A_OPER_MPL_ORBSCT_20160216T192404_99999999T999999_0002.EOF
    store_params:
      # s3_secret_alias: s3_cluster # see secrets.json
      storage_options:
        key: ${S3_ACCESSKEY_CLUSTER}
        secret: ${S3_SECRETKEY_CLUSTER}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT_CLUSTER}
          region_name: ${S3_REGION_CLUSTER}

  - id: FRO
    path: s3://rs-dev-cluster-temp/stations/ADGS/test-l0-develop-2/S3_D_TDS_1/AUX/S3A_AX___FRO_AX_20200117T000000_20200127T000000_20200120T065046___________________EUM_O_AL_001.SEN3/S3A_OPER_MPL_ORBRES_20200117T000000_20200127T000000_0001.EOF
    store_params:
      # s3_secret_alias: s3_cluster # see secrets.json
      storage_options:
        key: ${S3_ACCESSKEY_CLUSTER}
        secret: ${S3_SECRETKEY_CLUSTER}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT_CLUSTER}
          region_name: ${S3_REGION_CLUSTER}


  output_products:
  - id: S03ISPS
    path: ${OUTPUT_DIR}/s3l0/L0_Products.short
    type: folder
    opening_mode: "CREATE_OVERWRITE"
    store_type: zarr
    store_params:
      # s3_secret_alias: s3_local_or_cluster # see secrets.json
      storage_options:
        key: ${S3_ACCESSKEY}
        secret: ${S3_SECRETKEY}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT}
          region_name: ${S3_REGION}

  - id: S03CACHE
    path: ${OUTPUT_DIR}/s3l0/CACHE.short
    type: folder
    opening_mode: "CREATE_OVERWRITE"
    store_type: zarr
    store_params:
      # s3_secret_alias: s3_local_or_cluster # see secrets.json
      storage_options:
        key: ${S3_ACCESSKEY}
        secret: ${S3_SECRETKEY}
        client_kwargs:
          endpoint_url: ${S3_ENDPOINT}
          region_name: ${S3_REGION}

# Any secret files to be loaded in the secrets dictionary of EOConfiguration
secret:
  - ../secrets.json

# Any logging file(s) to load to the EOLogging facility
logging:
  - ../logging_config.yaml
# Any config file(s) to load to the EOConfiguration facility, general_configuration and env variables will overload them
config:
  - ./s3_default_configuration.yaml
  - ../cadu_configuration.yaml
