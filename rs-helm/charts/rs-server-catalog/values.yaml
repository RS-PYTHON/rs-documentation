# -- Namespace for the deployment
namespace: processing

# -- Number of replicas for the deployment
replicaCount: 1

service:
  # -- Port for the service
  port: 8080

app:
  # -- Port for the application
  port: 8000
  # -- Config directory for the application
  confDir: /app/conf
  # -- URL of the API Key Manager service
  uacURL: http://apikeymanager.processing.svc.cluster.local:8000/auth/check_key
  # -- OAuth2 attributes to read and save, as a comma-separated str
  oauth2Attributes: monthly-download-volume-limit-gb
  # -- URL of the API Key Manager home page (public)
  uacHomeUrl: https://apikeymanager.subdomain.example.com/docs
  # -- Object Storage bucket for the catalog
  catalogBucket: rs-cluster-catalog
  # -- The path prefix for the underlying FastAPI router
  prefixPath: /catalog
  # -- URL of FastAPI OpenAPI schema
  openApiUrl: /catalog/api
  # -- URL of FastAPI Swagger UI
  docsUrl: /catalog/api.html
  # -- Presigned URL expiration time in seconds. 30 min by default
  presignedUrlExpirationTime: 1800
  # -- Period in seconds between two data lifecycle cleaning tasks. If <0, the task is deactivated. Default: 24 hours
  dataLifecyclePeriod: 86400
  # -- Number of complete S3 cleanup retries before catalog metadata deletion. Default: 0
  catalogDeleteMaxRetries: 0
  metadata:
    # -- update the catalog metadata id parameter over the default one received from the pystac client
    id: "rs-python"
    # -- update the catalog metadata title parameter over the default one received from the pystac client
    title: "RS-PYTHON STAC Catalog"
    # -- update the catalog metadata description parameter over the default one received from the pystac client
    description: "STAC catalog of Copernicus Reference System Python"
  # -- URL of OSAM service
  endpointOsam: https://subdomain.example.com/osam
  # -- Maximum number of workers for the catalog - publish task. Default: 6
  publishCheckMaxWorkers: 6

obs:
  # -- URL of the object storage service endpoint
  endpoint: http://seaweedfs-s3.seaweedfs.svc.cluster.local:9000
  region: sbg
  secret:
    # -- Access Key to authenticate with the object storage service with admin rights. Only used for the data lifecyle.
    ak: TDr8foJqSygBQ9YFmWDy
    # -- Secret Key to authenticate with the object storage service with admin rights. Only used for the data lifecyle.
    sk: z2RaqjFttnVZRTsLLqmy4PE6PzJOKzPsE47alDBs

auth:
  secret:
    # -- OIDC End Point
    oidc_endpoint: "https://iam.example.com"
    # -- OIDC Realm
    oidc_realm: "rspy"
    # -- OIDC CLient ID
    oidc_client_id: "apikeymanager"
    # -- OIDC Secret used to sync user info from Keycloak
    oidc_client_secret: ""
    # -- Random string used to encode cookie-based HTTP sessions in SessionMiddleware
    cookie_secret: ""

postgres:
  # -- PostgreSQL port
  port: "5432"
  # -- PostgreSQL database name
  db: catalog
  # -- PostgreSQL service URL
  host: cnpgstac-rw.database.svc.cluster.local
  secret:
    # -- Username to authenticate with the PostgreSQL service
    user: catalog
    # -- Password to authenticate with the PostgreSQL service
    pass: password

image:
  # -- Image registry
  registry: ghcr.io
  # -- Image repository
  repository: rs-python
  # -- Image name
  name: rs-server-catalog
  # -- Image version, can be a tag or a digest
  version: "1.0a12"
  # -- Image pull policy
  PullPolicy: IfNotPresent

ingress:
  # -- Enabled/Disable ingress
  enabled: false
  issuer:
    # -- Ingress Issuer type
    type: cluster-issuer
    # -- Ingress Issuer name
    name: letsencrypt-prod
  # -- Ingress host name
  host: subdomain.example.com
  # -- Ingress path
  path:
    - /catalog
    - /auth

gatewayapi:
  # -- Enabled/Disable Gateway API
  enabled: false
  # -- HTTPRoute parentRefs, can either be a ListenerSet or a Gateway
  # Example :
  # parentRefs:
  # - group: gateway.networking.k8s.io
  #   kind: ListenerSet
  #   name: mylistenerset
  #   namespace: processing
  parentRefs: []
  # -- HTTPRoute host name
  host: subdomain.example.com
  # -- HTTPRoute path for the application
  # Example :
  # path:
  #   - /catalog
  #   - /auth
  path: []

resources:
  request:
    # -- Pod memory request
    ram: "256Mi"
    # -- Pod CPU request
    cpu: "100m"
  limit:
    # -- Pod memory limit
    ram: "1000Mi"
    # -- Pod CPU limit
    cpu: "500m"

probe:
  startup:
    # -- Path for the liveness probe
    path: /catalog/_mgmt/health
    # -- Port for the liveness probe
    port: 8000
    # -- InitialDelaySeconds for the liveness probe
    initialDelaySeconds: 20
    # -- periodSeconds for the liveness probe
    periodSeconds: 2
    # -- timeoutSeconds for the liveness probe
    timeoutSeconds: 1
  liveness:
    # -- Path for the liveness probe
    path: /catalog/_mgmt/health
    # -- Port for the liveness probe
    port: 8000
    # -- InitialDelaySeconds for the liveness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the liveness probe
    periodSeconds: 30
    # -- timeoutSeconds for the liveness probe
    timeoutSeconds: 5
  readiness:
    # -- Path for the readiness probe
    path: /catalog/_mgmt/health
    # -- Port for the readiness probe
    port: 8000
    # -- InitialDelaySeconds for the readiness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the readiness probe
    periodSeconds: 30
    # -- timeoutSeconds for the readiness probe
    timeoutSeconds: 5

# -- Pod affinity
affinity: {}

# -- Pod toleration
tolerations: []

# -- Pod initContainers
initContainers: []

cors:
  # -- A list of origins that should be permitted to make cross-origin requests. Needed for STAC Browser
  origins: https://stac-browser-catalog.subdomain.example.com,http://localhost:8080
  # -- A list of HTTP methods that should be allowed for cross-origin requests. Defaults to "GET,POST,OPTIONS"
  methods: GET,POST,OPTIONS
  # -- Set to true to enable credentials via CORS requests. Note that you'll need to set CORS_ORIGINS to something other than *, because credentials are disallowed for wildcard CORS origins.
  credentials: true
  # -- If CORS credentials are true and you're using an Authorization header, set this to Content-Type,Authorization. Alternatively, you can allow all headers by setting this to *.
  headers: '*'

tempo:
  # -- Grafana tempo endpoint.
  endpoint: http://alloy.monitoring.svc.cluster.local:4317

otel:
  # -- Trace request headers with OpenTelemetry ?
  trace_headers: false
  # -- Trace request bodies and response contents with OpenTelemetry ?
  trace_body: false
