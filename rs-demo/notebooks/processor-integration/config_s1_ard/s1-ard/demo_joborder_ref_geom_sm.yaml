variables:
  cslcs_path: &cslcs_path ${OUTPUT_DIR}/S01SIWCSL_20240416T171518_0027_A015_S000_00000_DV.zarr
  nrb_path: &nrb_path ${OUTPUT_DIR}/S01SIWNRB_20240416T171518_0027_A015_S000_00000_DV.zarr
  reference_date: &reference_date "2021-06-07"
  dynamic_working_directory: &dynamic_working_directory ${WORKING_DIR}/DYNAMIC
  static_working_directory: &static_working_directory ${WORKING_DIR}/STATIC

general_configuration:
  logging:
    level: DEBUG
  triggering__use_basic_logging: true
  triggering__validate_run: false
  dask_utils__timeout: 3000

workflow:
  - name: calibration
    module: s1_l12_rp.computing.ard_processing_units
    processing_unit: Calibration
    adfs:
      CONFIG: CONFIG
      ORBIT: ORBIT
    parameters:
      slcs_path:
        - s3://rs-dev-cluster-temp/ARD_V2/SAFE/S1B_S3_SLC__1SSV_20210607T070345_20210607T070410_027247_03412B_569D.SAFE
        - s3://rs-dev-cluster-temp/ARD_V2/SAFE/S1B_S3_SLC__1SSV_20210619T070345_20210619T070410_027422_034668_1E3B.SAFE
        - s3://rs-dev-cluster-temp/ARD_V2/SAFE/S1B_S3_SLC__1SSV_20210701T070346_20210701T070411_027597_034B4A_521C.SAFE
      multiburst: false
      dynamic_working_directory: *dynamic_working_directory

  - name: reference_dem
    module: s1_l12_rp.computing.ard_processing_units
    processing_unit: ReferenceDEM
    inputs:
      slcs: calibration.slcs # Contains the input SLCs
    adfs:
      CONFIG: CONFIG
      DEM: DEM
    parameters:
      dynamic_working_directory: *dynamic_working_directory
      spacing: { "x": 30, "y": 30 }
      chunks: { "x": 512, "y": 512 }

  - name: reference_geometry
    module: s1_l12_rp.computing.ard_processing_units
    processing_unit: ReferenceGeometry
    inputs:
      slcs: calibration.slcs # Contains the input SLCs
      dem: reference_dem.DEM # Digital Elevation Model
    adfs:
      CONFIG: CONFIG
    parameters:
      reference_date: *reference_date
      static_working_directory: *static_working_directory
      dynamic_working_directory: *dynamic_working_directory
      recompute: true
      chunk_length: 512

I/O:
  input_products:
    - id: slcs
      path: /NOT_USED
      store_params:
        chunks: {}
      store_type: zarr

  adfs:

    - id: CONFIG
      path: s3://rs-dev-cluster-temp/ARD_V2/ADFS/CONFIG/ard.json
      store_params:
        # s3_secret_alias: s3_cluster # see secrets.json
        storage_options:
          key: ${S3_ACCESSKEY_CLUSTER}
          secret: ${S3_SECRETKEY_CLUSTER}
          client_kwargs:
            endpoint_url: ${S3_ENDPOINT_CLUSTER}
            region_name: ${S3_REGION_CLUSTER}

    - id: S2_TILES
      path: s3://rs-dev-cluster-temp/ARD_V2/ADFS/KML/S2A_OPER_GIP_TILPAR_MPC__20151209T095117_V20150622T000000_21000101T000000_B00.kml
      store_params:
        # s3_secret_alias: s3_cluster # see secrets.json
        storage_options:
          key: ${S3_ACCESSKEY_CLUSTER}
          secret: ${S3_SECRETKEY_CLUSTER}
          client_kwargs:
            endpoint_url: ${S3_ENDPOINT_CLUSTER}
            region_name: ${S3_REGION_CLUSTER}

    - id: DEM
      path: s3://rs-sentinel-1-ard-input/ARD_V2/ADFS/MAROCCO/DEM
      store_params:
        # s3_secret_alias: s3_cluster # see secrets.json
        storage_options:
          key: ${S3_ACCESSKEY_CLUSTER}
          secret: ${S3_SECRETKEY_CLUSTER}
          client_kwargs:
            endpoint_url: ${S3_ENDPOINT_CLUSTER}
            region_name: ${S3_REGION_CLUSTER}

    - id: ORBIT
      path: s3://rs-dev-cluster-temp/ARD_V2/ADFS/MAROCCO/ORBIT
      store_params:
        # s3_secret_alias: s3_cluster # see secrets.json
        storage_options:
          key: ${S3_ACCESSKEY_CLUSTER}
          secret: ${S3_SECRETKEY_CLUSTER}
          client_kwargs:
            endpoint_url: ${S3_ENDPOINT_CLUSTER}
            region_name: ${S3_REGION_CLUSTER}

  output_products:
    - id: cslcs
      path: *cslcs_path
      type: filename
      opening_mode: "CREATE_OVERWRITE"
      store_type: zarr
      store_params:
        consolidate: True
    - id: nrb
      path: *nrb_path
      type: filename
      opening_mode: "CREATE_OVERWRITE"
      store_type: zarr
      store_params:
        consolidate: True

# Any secret files to be loaded in the secrets dictionary of EOConfiguration
secret:
  - ../secrets.json

# Any logging file(s) to load to the EOLogging facility
logging: ../logging_config.yaml
