# NOTE: Taken as is from https://gitlab.eopf.copernicus.eu/S3/OLCI/s3olci/-/blob/main/resources/payloads/payload_ol1.yaml

general_configuration:
  logging:
    level: INFO
  triggering__use_basic_logging: true
  triggering__wait_before_exit: 0
  triggering__use_datatree: true
  triggering__create_temporary: true
  triggering__use_default_filename: false
dask_context:
  cluster_type: local
  cluster_config:
    n_workers: 1
    threads_per_worker: 8
    memory_limit: 100GiB
  client_config: {}
  performance_report_file: report.html
  dask_config:
    distributed.worker.local_directory: ~/eopf/output
_store_params:
  store_params: &id001
    secret_alias: s3input
    storage_options:
      key: $S3_KEY
      secret: $S3_SECRET
      client_kwargs:
        endpoint_url: $S3_ENDPOINT_URL
        region_name: $S3_REGION_NAME
workflow:
- name: processor_ol1
  active: true
  module: s3olci.s3_ol1.ol1_processor
  processing_unit: OL1Processor
  inputs:
    S3OLCIL0_1: dt_l0_1
    S3OLCIL0_2: dt_l0_2
    S3OLCIL0_3: dt_l0_3
    S3NAVL0_1: dt_nat
  adfs:
    OLPRG: OLPRG_ADF
    OLINS: OLINS_ADF
    OLEOP: OLEOP_ADF
    OLCAL: OLCAL_ADF
    OLLUT: OLLUT_ADF
    WATER: WATER_ADF
    FRO: FRO_ADF
    OSF: OSF_ADF
  parameters:
    start_datetime: '2023-05-12T17:47:02.000000Z'
    end_datetime: '2023-05-12T17:47:10.000000Z'
    # start_datetime: '2023-05-12T17:48:02.000000Z'
    # end_datetime: '2023-05-12T17:50:02.000000Z'
    no_pdgs: false
    lossless_data_split: false
  outputs:
    S03OLCEFR: ol1_product_fr
    S03OLCERR: ol1_product_rr
I/O:
  input_products:
  - store_params: *id001
    id: dt_l0_1
    path: s3://dpr-s3-input/Validation/OLCI/MINI_DATA_FOR_TESTS/S3B_20230512T174702/S03OLCL0__20230512T174522_0119_B212_TD60.zarr.zip
    store_type: zarr
  - store_params: *id001
    id: dt_l0_2
    path: s3://dpr-s3-input/Validation/OLCI/MINI_DATA_FOR_TESTS/S3B_20230512T174702/S03OLCL0__20230512T174722_0119_B212_T135.zarr.zip
    store_type: zarr
  - store_params: *id001
    id: dt_l0_3
    path: s3://dpr-s3-input/Validation/OLCI/MINI_DATA_FOR_TESTS/S3B_20230512T174702/S03OLCL0__20230512T174922_0119_B212_TD1E.zarr.zip
    store_type: zarr
  - store_params: *id001
    id: dt_nat
    path: s3://dpr-s3-input/Validation/OLCI/MINI_DATA_FOR_TESTS/S3B_20230512T174702/S03NATL0__20230512T172755_6006_B212__7DE.zarr.zip
    store_type: zarr
  adfs:
  - store_params: *id001
    id: OLPRG_ADF
    path: s3://dpr-s3-input/Auxiliary/OL1/S3B_ADF_OLPRG_20180425T000000_20991231T235959_20240427T201544.zarr
  - store_params: *id001
