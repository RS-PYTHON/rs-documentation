prefect-version: "3"

pull:
- prefect.deployments.steps.git_clone:
    repository: https://github.com/RS-PYTHON/rs-client-libraries.git
    branch: develop # should be 'develop' in git

definitions:
    work_pools:
        prefect_work_pool_sandbox: &prefect_work_pool_sandbox
            name: "{{ PREFECT_WORK_POOL_SANDBOX }}"

deployments:
- name: Convert Adf
  version: "todo-version"
  tags: ["adf", "on-demand"]
  work_pool: *prefect_work_pool_sandbox
  entrypoint: ./rs_workflows/adf_flow.py:adf_conversion
