{{- range $key, $value := .Values.app.stations }}
{{- $auth := $value.authentication }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $value.service.name }}-{{ $key }}
  namespace: {{ $.Values.namespace }}
type: Opaque
data:
  {{- $prefix := $key | upper }}

  {{- if not $auth }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__DOMAIN: {{ $value.domain | b64enc | quote }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__SERVICE__NAME: {{ $value.service.name | b64enc | quote }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__SERVICE__URL: {{ $value.service.url | b64enc | quote }}
  {{- else }}
    {{- if ne $auth.auth_type "ftp" }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__DOMAIN: {{ $value.domain | b64enc | quote }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__SERVICE__NAME: {{ $value.service.name | b64enc | quote }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__SERVICE__URL: {{ $value.service.url | b64enc | quote }}
    {{- end }}
  {{- end }}

  {{- if not $auth }}
    {{- if $value.trusteddomains }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__TRUSTEDDOMAINS: {{ (printf "[%s]" ($value.trusteddomains | join ", ")) | b64enc | quote}}
    {{- end }}
  {{- else }}
    {{- if and (ne $auth.auth_type "s3") (ne $auth.auth_type "ftp") }}
      {{- if $value.trusteddomains }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__TRUSTEDDOMAINS: {{ (printf "[%s]" ($value.trusteddomains | join ", ")) | b64enc | quote}}
      {{- end }}
    {{- end }}
  {{- end }}

  {{- if $auth }}

    {{- if eq $auth.auth_type "ftp" }}
  {{ $prefix }}_HOST: {{ $value.domain | b64enc | quote }}
  {{ $prefix }}_PORT: {{ $value.service.port | toString | b64enc | quote }}
  {{ $prefix }}_USER: {{ $auth.username | b64enc | quote }}
  {{ $prefix }}_PASS: {{ $auth.password | toString | b64enc | quote }}
    {{- end }}

    {{- if ne $auth.auth_type "ftp" }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__AUTH__TYPE: {{ $auth.auth_type | b64enc | quote }}
    {{- end }}

    {{- if eq $auth.auth_type "s3" }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__ACCESS__KEY: {{ $auth.access_key | b64enc | quote }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__SECRET__KEY: {{ $auth.secret_key | b64enc | quote }}
    {{- end }}

    {{- if ne $auth.auth_type "s3" }}
      {{- if ne $auth.auth_type "ftp" }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__TOKEN__URL: {{ $auth.token_url | b64enc | quote }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__GRANT__TYPE: {{ $auth.grant_type | b64enc | quote }}
        {{- if $auth.scope }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__SCOPE: {{ $auth.scope | b64enc | quote }}
        {{- end }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__USERNAME: {{ $auth.username | b64enc | quote }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__PASSWORD: {{ $auth.password | toString | b64enc | quote }}
        {{- if $auth.client_id }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__CLIENT__ID: {{ $auth.client_id | b64enc | quote }}
        {{- end }}
        {{- if $auth.client_secret }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__CLIENT__SECRET: {{ $auth.client_secret | b64enc | quote }}
        {{- end }}
        {{- if $auth.authorization }}
  RSPY__TOKEN__{{ $value.service.name | upper }}__{{ $key | upper }}__AUTHENTICATION__AUTHORIZATION: {{ $auth.authorization | b64enc | quote }}
        {{- end }}
      {{- end }}
    {{- end }}

  {{- end }}

{{- if $auth }}
  {{- if eq $auth.auth_type "ftp" }}
stringData:
  {{- $prefix := $key | upper }}
    {{ $prefix }}_CLIENT_CRT: |-
      {{- $auth.client_crt | nindent 6 }}
    {{ $prefix }}_CLIENT_KEY: |-
      {{- $auth.client_key | nindent 6 }}
    {{ $prefix }}_CA_CRT: |-
      {{- $auth.ca_crt | nindent 6 }}
  {{- end }}
{{- end }}

{{- end }}
