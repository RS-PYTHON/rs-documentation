# -- Namespace for the deployment
namespace: processing

# -- Number of replicas for the deployment
replicaCount: 1

service:
  # -- Port for the service
  port: 8080

app:
  # -- Port for the application
  port: 8000
  # -- Config directory for the application
  confDir: /app/conf
  # -- Station configuration file for the application
  stationConfigFile: stations_cfg.json
  adgsSearchConfigFile: adgs_search_config.yaml
  # -- EODAG configuration file for the application. Uses adgs_ws_config.yaml by default.
  # -- Set properly the EODAG_ADGS_CONFIG env var.
  eodagConfigFile: adgs_ws_config.yaml
  station:
    adgs:
      # -- Station URL - Example: http://mockup-station-adgs.processing.svc.cluster.local:8080/Products
      endpoint: ""
      # -- Station config file - Example: adgs_service_config.yaml
      configFile: adgs_service_config.yaml
  # -- URL of the API Key Manager service
  uacURL: http://apikeymanager.processing.svc.cluster.local:8000/auth/check_key
  # -- OAuth2 attributes to read and save, as a comma-separated str
  oauth2Attributes: monthly-download-volume-limit-gb

probe:
  startup:
    # -- Path for the liveness probe
    path: /health
    # -- Port for the liveness probe
    port: 8000
    # -- InitialDelaySeconds for the liveness probe
    initialDelaySeconds: 10
    # -- periodSeconds for the liveness probe
    periodSeconds: 2
    # -- timeoutSeconds for the liveness probe
    timeoutSeconds: 1
  liveness:
    # -- Path for the liveness probe
    path: /health
    # -- Port for the liveness probe
    port: 8000
    # -- InitialDelaySeconds for the liveness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the liveness probe
    periodSeconds: 30
    # -- timeoutSeconds for the liveness probe
    timeoutSeconds: 5
  readiness:
    # -- Path for the readiness probe
    path: /health
    # -- Port for the readiness probe
    port: 8000
    # -- InitialDelaySeconds for the readiness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the readiness probe
    periodSeconds: 30
    # -- timeoutSeconds for the readiness probe
    timeoutSeconds: 5

auth:
  secret:
    # -- OIDC End Point
    oidc_endpoint: ""
    # -- OIDC Realm
    oidc_realm: ""
    # -- OIDC CLient ID
    oidc_client_id: ""
    # -- OIDC Secret used to sync user info from Keycloak
    oidc_client_secret: ""
    # -- Random string used to encode cookie-based HTTP sessions in SessionMiddleware
    cookie_secret: ""

image:
  # -- Image registry
  registry: ghcr.io
  # -- Image repository
  repository: rs-python
  # -- Image name
  name: rs-server-adgs
  # -- Image version, can be a tag or a digest
  version: "1.0a12"
  # -- Image pull policy
  PullPolicy: IfNotPresent

ingress:
  # -- Enabled/Disable ingress
  enabled: false
  issuer:
    # -- Ingress Issuer type
    type: cluster-issuer
    # -- Ingress Issuer name
    name: letsencrypt-prod
  # -- Ingress host name
  host: subdomain.example.com
  # -- Ingress path
  path:
    - /adgs
    - /auxip

gatewayapi:
  # -- Enabled/Disable Gateway API
  enabled: false
  # -- HTTPRoute parentRefs, can either be a ListenerSet or a Gateway
  # Example :
  # parentRefs:
  # - group: gateway.networking.k8s.io
  #   kind: ListenerSet
  #   name: mylistenerset
  #   namespace: processing
  parentRefs: []
  # -- HTTPRoute host name
  host: subdomain.example.com
  # -- HTTPRoute path for the application
  # Example :
  # path:
  #   - /adgs
  #   - /auxip
  path: []

resources:
  request:
    # -- Pod memory request
    ram: "256Mi"
    # -- Pod CPU request
    cpu: "100m"
  limit:
    # -- Pod memory limit
    ram: "1000Mi"
    # -- Pod CPU limit
    cpu: "500m"

# -- Pod affinity
affinity: {}

# -- Pod toleration
tolerations: []

# -- Pod initContainers
initContainers: []

cors:
  # -- A list of origins that should be permitted to make cross-origin requests. Needed for STAC Browser
  origins: https://stac-browser-auxip.subdomain.example.com,http://localhost:8080

tempo:
  # -- Grafana tempo endpoint.
  endpoint: http://alloy.monitoring.svc.cluster.local:4317

otel:
  # -- Trace request headers with OpenTelemetry ?
  trace_headers: false
  # -- Trace request bodies and response contents with OpenTelemetry ?
  trace_body: false
