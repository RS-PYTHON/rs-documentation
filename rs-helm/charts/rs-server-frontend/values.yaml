# -- Namespace for the deployment
namespace: processing

# -- Number of replicas for the deployment
replicaCount: 1

service:
  # -- Port for the service
  port: 8080

app:
  # -- Port for the application
  port: 8000
  # -- URL suffix for the application. Must be the same value as ingress.path
  docsUrl: /docs
  # -- URL of the API Key Manager service (internal)
  uacUrl: http://apikeymanager.processing.svc.cluster.local:8000/auth/check_key
  # -- OAuth2 attributes to read and save, as a comma-separated str
  oauth2Attributes: monthly-download-volume-limit-gb
  # -- URL of the API Key Manager home page (public)
  uacHomeUrl: https://apikeymanager.subdomain.example.com/docs

probe:
  startup::
    # -- Path for the liveness probe
    path: /health
    # -- Port for the liveness probe
    port: 8000
    # -- InitialDelaySeconds for the liveness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the liveness probe
    periodSeconds: 2
    # -- timeoutSeconds for the liveness probe
    timeoutSeconds: 1
  liveness:
    # -- Path for the liveness probe
    path: /health
    # -- Port for the liveness probe
    port: 8000
    # -- InitialDelaySeconds for the liveness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the liveness probe
    periodSeconds: 30
    # -- timeoutSeconds for the liveness probe
    timeoutSeconds: 5
  readiness:
    # -- Path for the readiness probe
    path: /health
    # -- Port for the readiness probe
    port: 8000
    # -- InitialDelaySeconds for the readiness probe
    initialDelaySeconds: 0
    # -- periodSeconds for the readiness probe
    periodSeconds: 30
    # -- timeoutSeconds for the readiness probe
    timeoutSeconds: 5

image:
  # -- Image registry
  registry: ghcr.io
  # -- Image repository
  repository: rs-python
  # -- Image name
  name: rs-server-frontend
  # -- Image version, can be a tag or a digest
  version: "1.0a12"
  # -- Image pull policy
  PullPolicy: IfNotPresent

ingress:
  # -- Enabled/Disable ingress
  enabled: false
  issuer:
    # -- Ingress Issuer type
    type: cluster-issuer
    # -- Ingress Issuer name
    name: letsencrypt-prod
  # -- Ingress host name
  host: subdomain.example.com
  # -- Ingress path for the application. Must be the same value as app.docsUrl.
  path: /docs

gatewayapi:
  # -- Enabled/Disable Gateway API
  enabled: false
  # -- HTTPRoute parentRefs, can either be a ListenerSet or a Gateway
  # Example :
  # parentRefs:
  # - group: gateway.networking.k8s.io
  #   kind: ListenerSet
  #   name: mylistenerset
  #   namespace: processing
  parentRefs: []
  # -- HTTPRoute host name
  host: subdomain.example.com
  # -- HTTPRoute path for the application
  # Example :
  # path:
  #   - /docs
  path: []

resources:
  request:
    # -- Pod memory request
    ram: "256Mi"
    # -- Pod CPU request
    cpu: "100m"
  limit:
    # -- Pod memory limit
    ram: "1000Mi"
    # -- Pod CPU limit
    cpu: "500m"

# -- Pod affinity
affinity: {}

# -- Pod toleration
tolerations: []

# -- Pod initContainers
initContainers: []

stac_browser:
  # -- The list of all STAC Browser URLs
  urls: "https://stac-browser-auxip.subdomain.example.com;https://stac-browser-cadip.subdomain.example.com;https://stac-browser-prip.subdomain.example.com;https://stac-browser-catalog.subdomain.example.com"
