name: poetry-install
description: "'poetry install' this project and dependencies"

inputs:
  options:
    description: "'poetry install' options e.g. '--with dev'"
    required: false
    default:

  working-directory:
    description: "the working directory in which poetry is run."
    required: false
    default: .

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/install-python
    # Install poetry with pip, like the RS-PYTHON/actions setup-poetry action. snok/install-poetry downloads its
    # installer with the Python-urllib user agent, that install.python-poetry.org rejects with HTTP 403.
    - name: Install poetry
      run: |
        set -x
        pip install --only-binary=:all: poetry==2.5.1
      shell: bash

    - env:
        INPUTS_OPTIONS: ${{ inputs.options }}
      run: |
        set -x
        poetry install $INPUTS_OPTIONS # don't use quotes around options
      working-directory: ${{ inputs.working-directory }}
      shell: bash
