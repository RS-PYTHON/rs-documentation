<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 640" width="1010" height="640" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474F"/>
    </marker>
    <marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2E7D32"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #263238; }
      .part { stroke-width: 2; rx: 6; }
      .ptxt { font-weight: bold; fill: #263238; text-anchor: middle; }
      .psub { font-size: 11px; fill: #455A64; text-anchor: middle; }
      .life { stroke: #90A4AE; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .msg { stroke: #37474F; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .ret { stroke: #37474F; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 4; }
      .new { stroke: #2E7D32; stroke-width: 2.5; fill: none; marker-end: url(#arrowgreen); }
      .txt { fill: #263238; font-size: 12px; }
      .newtxt { fill: #2E7D32; font-weight: bold; font-size: 12px; }
      .badge { fill: #00796B; }
      .badgenew { fill: #2E7D32; }
      .num { fill: #fff; font-weight: bold; font-size: 12px; text-anchor: middle; }
      .busy { fill: #C8E6C9; stroke: #2E7D32; stroke-width: 1.5; }
    </style>
  </defs>

  <text x="505" y="30" text-anchor="middle" class="title">Proposed workflow: one Dask task level, driver in a Kubernetes Job</text>

  <!-- Participants -->
  <rect x="10" y="50" width="120" height="46" class="part" fill="#FFF3E0" stroke="#EF6C00"/>
  <text x="70" y="70" class="ptxt">User</text>
  <rect x="155" y="50" width="120" height="46" class="part" fill="#E0F2F1" stroke="#00796B"/>
  <text x="215" y="70" class="ptxt">Prefect flow</text><text x="215" y="86" class="psub">rs-client-libraries</text>
  <rect x="300" y="50" width="120" height="46" class="part" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="360" y="70" class="ptxt">rs-dpr-service</text><text x="360" y="86" class="psub">ONE generic instance</text>
  <rect x="445" y="50" width="120" height="46" class="part" fill="#ECEFF1" stroke="#455A64"/>
  <text x="505" y="70" class="ptxt">Kubernetes API</text><text x="505" y="86" class="psub">Jobs, pod logs</text>
  <rect x="590" y="50" width="120" height="46" class="part" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="650" y="70" class="ptxt">Driver pod</text><text x="650" y="86" class="psub">cluster image + EOPF</text>
  <rect x="735" y="50" width="120" height="46" class="part" fill="#F3E5F5" stroke="#6A1B9A"/>
  <text x="795" y="70" class="ptxt">Dask scheduler</text><text x="795" y="86" class="psub">existing cluster</text>
  <rect x="880" y="50" width="120" height="46" class="part" fill="#F3E5F5" stroke="#6A1B9A"/>
  <text x="940" y="70" class="ptxt">Dask workers</text><text x="940" y="86" class="psub">compute only</text>

  <!-- Lifelines -->
  <line x1="70" y1="96" x2="70" y2="610" class="life"/>
  <line x1="215" y1="96" x2="215" y2="610" class="life"/>
  <line x1="360" y1="96" x2="360" y2="610" class="life"/>
  <line x1="505" y1="96" x2="505" y2="610" class="life"/>
  <line x1="650" y1="96" x2="650" y2="610" class="life"/>
  <line x1="795" y1="96" x2="795" y2="610" class="life"/>
  <line x1="940" y1="96" x2="940" y2="610" class="life"/>

  <!-- Driver busy bar -->
  <rect x="640" y="296" width="20" height="196" class="busy"/>

  <!-- Step 1 note -->
  <rect x="10" y="108" width="470" height="26" rx="5" fill="#F3E5F5" stroke="#6A1B9A" stroke-width="1"/>
  <text x="22" y="126" class="txt"><tspan font-weight="bold" fill="#00796B">1</tspan>  Unchanged: the user created the cluster and has its id and label</text>

  <!-- 2 -->
  <path class="msg" d="M 70 165 L 215 165"/>
  <circle cx="92" cy="153" r="11" class="badge"/><text x="92" y="157" class="num">2</text>
  <text x="110" y="147" class="txt">inputs + cluster</text>
  <text x="110" y="185" class="txt">(flow writes the payload file)</text>

  <!-- 3 -->
  <path class="msg" d="M 215 215 L 360 215"/>
  <circle cx="237" cy="203" r="11" class="badge"/><text x="237" y="207" class="num">3</text>
  <text x="255" y="198" class="txt" font-size="11">REST + payload</text>

  <!-- 4 -->
  <path class="msg" d="M 360 242 L 400 242 L 400 262 L 360 262"/>
  <circle cx="420" cy="252" r="11" class="badge"/><text x="420" y="256" class="num">4</text>
  <text x="436" y="247" class="txt" font-size="11">complete the payload,</text>
  <text x="436" y="261" class="txt" font-size="11">read the cluster image</text>

  <!-- 5 -->
  <path class="new" d="M 360 300 L 505 300"/>
  <circle cx="382" cy="288" r="11" class="badgenew"/><text x="382" y="292" class="num">5</text>
  <text x="400" y="283" class="newtxt" font-size="11">create Job</text>

  <!-- 6 -->
  <path class="new" d="M 505 335 L 650 335"/>
  <circle cx="527" cy="323" r="11" class="badgenew"/><text x="527" y="327" class="num">6</text>
  <text x="545" y="318" class="newtxt" font-size="11">start the pod</text>
  <text x="670" y="332" class="newtxt" font-size="11">eopf trigger</text>
  <text x="670" y="346" class="newtxt" font-size="11">local payload</text>

  <!-- 7 -->
  <path class="new" d="M 660 385 L 795 385"/>
  <circle cx="682" cy="373" r="11" class="badgenew"/><text x="682" y="377" class="num">7</text>
  <text x="700" y="368" class="newtxt" font-size="11">reuse_cluster</text>
  <text x="815" y="396" class="newtxt" font-size="11">tasks: the only kind</text>
  <text x="815" y="409" class="newtxt" font-size="11">of Dask task</text>
  <path class="new" d="M 795 415 L 940 415"/>

  <!-- Logs and status -->
  <path class="ret" d="M 505 455 L 370 455"/>
  <text x="385" y="449" class="txt" font-size="11">driver logs + Job status</text>
  <path class="ret" d="M 215 490 L 350 490"/>
  <text x="228" y="484" class="txt" font-size="11">GET status, logs</text>

  <path class="ret" d="M 640 520 L 515 520"/>
  <text x="545" y="514" class="txt" font-size="11">exit code 0: Job complete</text>
  <path class="ret" d="M 360 560 L 225 560"/>
  <text x="240" y="554" class="txt" font-size="11">status: successful</text>

  <!-- Cancel note -->
  <rect x="540" y="560" width="450" height="44" rx="6" fill="#E8F5E9" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="552" y="579" class="newtxt">Cancellation</text>
  <text x="552" y="595" class="txt">rs-dpr-service deletes the Job: SIGTERM to the driver, which stops its tasks.</text>
</svg>
