name: Generate documentation

# When to generate the doc ? Currently, on each push and with manual trigger
on:
  push:
  workflow_dispatch:

env:
  PYTHON_VERSION: 3.13.16

jobs:
  generate-documentation:
    name: Generate documentation
    runs-on: ubuntu-latest
    permissions:
      packages: read # to pull docker images when running build_aggregated_openapi.sh
      contents: write # to publish the generated documentation
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/install-python

      - name: Clone the RS-PYTHON repositories
        run: |
          set -x
          pwd
          ls -all
          cd docs
          ls -all

          # We want to use the same branch name (if it exists) in the other
          # cloned repositories as the current branch name
          branch_name=${{ github.ref_name }}

          # Clone rspy repositories (keep this list in sync with .gitignore and the documentation)
          for repo in $(cat ../.github/scripts/repositories.txt) ; do
            git clone https://github.com/RS-PYTHON/${repo}.git
            (cd ${repo}; git checkout $branch_name || git checkout develop)
          done
        working-directory: .
        shell: bash

      - name: Install dependencies
        uses: ./.github/actions/poetry-install
        with:
          options: '--verbose'

      - name: Generate Pydoc in projects
        run: |
          ./.github/scripts/generate_mkdocs.sh
        working-directory: .
        shell: bash

      - name: Build the HTML documentation
        run: poetry run mkdocs build
        working-directory: .
        shell: bash

      # Only the default branch is published, so that the online documentation is not overwritten
      # by the work in progress of other branches.
      - name: Deploy the HTML documentation to GitHub Pages
        if: github.ref == 'refs/heads/develop'
        run: poetry run mkdocs gh-deploy --force
        working-directory: .
        shell: bash
