  ###############
  # PRE-ACTIONS #
  ###############

  # Run a bash container as root to run custom pre-actions:
  #   - Give all permissions to the docker named volumes "rspy_working_dir"
  #   - Copy stations configuration files
  rspy-pre-actions:
    image: bash:latest
    container_name: rspy-pre-actions
    privileged: true
    volumes:
      - .:/docker/compose/dir
      - rspy_working_dir:${RSPY_WORKING_DIR} # docker named volume
    entrypoint: /docker/compose/dir/scripts/rspy-pre-actions.sh

############
# PROFILES #
############

# Don't use real docker-compose profiles (https://docs.docker.com/compose/how-tos/profiles/)
# because by default we want to run all services.
# Use this solution instead: https://stackoverflow.com/a/54027899

  cicd: # all needed services for the ci/cd demos
    image: bash:latest
    depends_on:
      - nginx
      - rs-server-adgs
      - rs-server-cadip
      - rs-server-catalog
      - rs-server-prip
      - rs-server-staging
      - adgs-station
      - cadip-station
      - lta-station
      - prip-station
      - prefect-server
      - prefect-worker-integrated
      - prefect-worker-monitoring
      - prefect-worker-sandbox
      - dask-staging
      - dask-eopf-mockup
      - postgres
      - catalog-db
      - seaweedfs-s3
      - jupyter
      # Use the rs-dpr-service container with same python and dask version as the
      # mockup DPR processor, which is the only processor used in the demos.
      - rs-dpr-service_py3.11.7-2024.5.2
    entrypoint: tail # use this so this service stays alive
    command: -F anything


#################
# CONFIGURATION #
#################

# Docker named volumes
volumes:
  seaweedfs_storage: {}
  prefect_storage: {}

  # Used to:
  #   - write a file lock
  #   - for the demo, download files locally in laptop mode (downloaded by rs-server, read by jupyter)
  rspy_working_dir: {}
