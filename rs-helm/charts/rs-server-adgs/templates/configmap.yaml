apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-service-config
  namespace: {{ .Values.namespace }}
data:
  {{ .Values.app.eodagConfigFile }}: |
    {{- range $k, $v := .Values.app.station }}
    {{ tpl ($.Files.Get (printf "config/%s" $v.configFile)) $ | nindent 4 }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-search-service-config
  namespace: {{ .Values.namespace }}
data:
  {{ .Values.app.adgsSearchConfigFile }}: |
    {{ .Files.Get (printf "config/%s" .Values.app.adgsSearchConfigFile) | nindent 4 }}
