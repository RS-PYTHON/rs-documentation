events {}

http {
  server {
    listen 80;

    # See: https://sandro-keil.de/blog/let-nginx-start-if-upstream-host-is-unavailable-or-down/
    # This is the internal Docker DNS, cache only for 30s
    resolver 127.0.0.11 valid=30s;

    # Swagger UI and OpenAPI served by rs-server-frontend
    location = /docs {
      proxy_pass http://rs-server-frontend:8000/docs;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs/ {
      proxy_pass http://rs-server-frontend:8000/docs/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
      proxy_pass http://rs-server-frontend:8000/openapi.json;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route ADGS backend under /auxip
    location = /auxip {
      return 301 /auxip/;
    }

    location /auxip/ {
      proxy_pass http://rs-server-adgs:8000/auxip/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route CADIP backend under /cadip
    location = /cadip {
      return 301 /cadip/;
    }

    location /cadip/ {
      proxy_pass http://rs-server-cadip:8000/cadip/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route PRIP backend under /prip
    location = /prip {
      return 301 /prip/;
    }

    location /prip/ {
      proxy_pass http://rs-server-prip:8000/prip/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route Catalog backend under /catalog
    location = /catalog {
      return 301 /catalog/;
    }

    location /catalog/ {
      proxy_pass http://rs-server-catalog:8000/catalog/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /staging {
      return 301 /staging/;
    }

    location /staging/ {
      proxy_pass http://rs-server-staging:8000/staging/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    ##################
    # rs-dpr-service #
    ##################

    # By default all requests go to rs-dpr-service_py3.11.7-2024.5.2
    location /dpr {
      # Don't use a trailing / so we forward the original request URI
      # See: https://oneuptime.com/blog/post/2025-12-16-fix-trailing-slash-nginx-proxy-pass/view
      proxy_pass http://rs-dpr-service_py3.11.7-2024.5.2:8000;
    }

    # Requests to these processors go to rs-dpr-service_py3.11.7-2026.1.2
    location ~ /dpr/processes/(conv_safe_zarr|mockup|other-proc1) {
      proxy_pass http://rs-dpr-service_py3.11.7-2026.1.2:8000;
    }

    # Requests to these processors go to rs-dpr-service_py3.13.12-2026.3.0
    location ~ /dpr/processes/(s1_ard|other-proc2) {
      proxy_pass http://rs-dpr-service_py3.13.12-2026.3.0:8000;
    }

    ########
    # dask #
    ########

    # Redirect /dask/<proc>/<subpath> to http://dask-<proc>:8000/<subpath>
    location ~ /dask/([^/]+)/(.*) {

      # Use variable for missing upstream from the ci/cd (see 'resolver' above)
      set $upstream http://dask-$1:8000/$2;
      proxy_pass $upstream;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-Proto $scheme;
    }

  }
}
