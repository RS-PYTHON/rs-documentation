<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #263238; }
      .head { font-size: 15px; font-weight: bold; fill: #263238; }
      .txt { fill: #263238; }
      .small { font-size: 12px; fill: #455A64; }
      .slot { stroke-width: 2; rx: 6; }
      .ok { fill: #E8F5E9; stroke: #2E7D32; }
      .wait { fill: #FFCDD2; stroke: #C62828; }
      .work { fill: #BBDEFB; stroke: #1565C0; }
      .free { fill: #fff; stroke: #90A4AE; stroke-dasharray: 5 4; }
      .queue { fill: #FFF8E1; stroke: #F9A825; }
    </style>
  </defs>

  <text x="550" y="30" text-anchor="middle" class="title">Inside a Dask worker: how task #1 starves task #2</text>

  <!-- Left panel -->
  <rect x="20" y="55" width="510" height="420" rx="10" fill="#FBF7FC" stroke="#6A1B9A" stroke-width="2"/>
  <text x="275" y="82" text-anchor="middle" class="head">One processing run: it works</text>
  <rect x="40" y="100" width="470" height="230" rx="8" fill="#fff" stroke="#6A1B9A" stroke-width="2"/>
  <text x="55" y="122" class="txt" font-weight="bold">Worker pod: 3 threads, 12 GB RAM (limit of the whole pod)</text>

  <rect x="55" y="138" width="440" height="42" class="slot wait"/>
  <text x="70" y="156" class="txt" font-weight="bold">Thread 1: task #1 (ProcessorCaller)</text>
  <text x="70" y="172" class="small">only waits for the EOPF-CPM subprocess, but keeps the thread</text>
  <rect x="55" y="190" width="440" height="42" class="slot work"/>
  <text x="70" y="208" class="txt" font-weight="bold">Thread 2: task #2 (processor computation)</text>
  <text x="70" y="224" class="small">submitted by EOPF-CPM to the same cluster</text>
  <rect x="55" y="242" width="440" height="42" class="slot work"/>
  <text x="70" y="260" class="txt" font-weight="bold">Thread 3: task #2 (processor computation)</text>
  <text x="70" y="276" class="small">a free thread is enough for the processing to progress</text>

  <rect x="55" y="292" width="440" height="30" rx="6" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="70" y="312" class="small">EOPF-CPM subprocess (driver): uses RAM and CPU of this pod</text>

  <text x="40" y="365" class="txt" font-weight="bold">Result</text>
  <text x="40" y="385" class="txt">1 thread out of 3 (33 %) is spent waiting. It is a waste of resources,</text>
  <text x="40" y="402" class="txt">but the run completes.</text>
  <text x="40" y="430" class="small">Cluster created with scale=1, worker_cores=3 (see the init-dask-clusters notebooks).</text>
  <text x="40" y="446" class="small">By default Dask Gateway starts one thread per core (to be checked on your cluster).</text>

  <!-- Right panel -->
  <rect x="570" y="55" width="510" height="420" rx="10" fill="#FFF8F8" stroke="#C62828" stroke-width="2"/>
  <text x="825" y="82" text-anchor="middle" class="head">Three runs at the same time: deadlock</text>
  <rect x="590" y="100" width="470" height="230" rx="8" fill="#fff" stroke="#C62828" stroke-width="2"/>
  <text x="605" y="122" class="txt" font-weight="bold">Worker pod: 3 threads, 12 GB RAM</text>

  <rect x="605" y="138" width="440" height="42" class="slot wait"/>
  <text x="620" y="156" class="txt" font-weight="bold">Thread 1: task #1 of run A (waiting)</text>
  <text x="620" y="172" class="small">waits for its task #2, which cannot start</text>
  <rect x="605" y="190" width="440" height="42" class="slot wait"/>
  <text x="620" y="208" class="txt" font-weight="bold">Thread 2: task #1 of run B (waiting)</text>
  <text x="620" y="224" class="small">waits for its task #2, which cannot start</text>
  <rect x="605" y="242" width="440" height="42" class="slot wait"/>
  <text x="620" y="260" class="txt" font-weight="bold">Thread 3: task #1 of run C (waiting)</text>
  <text x="620" y="276" class="small">waits for its task #2, which cannot start</text>

  <rect x="605" y="292" width="440" height="30" rx="6" fill="#FFF8E1" stroke="#F9A825" stroke-width="1.5"/>
  <text x="620" y="312" class="small">3 EOPF-CPM subprocesses: 3 drivers sharing the 12 GB of the pod</text>

  <rect x="590" y="340" width="470" height="50" class="slot queue"/>
  <text x="605" y="360" class="txt" font-weight="bold">Scheduler queue: task #2 of A, B and C</text>
  <text x="605" y="378" class="small">no free thread: they wait for a thread held by a task that waits for them</text>

  <text x="590" y="415" class="txt" font-weight="bold">Result</text>
  <text x="590" y="433" class="txt">Nothing progresses and nothing fails: the runs hang until a timeout.</text>
  <text x="590" y="450" class="small">The same happens with N runs on a cluster with N threads in total.</text>

  <!-- Legend -->
  <rect x="20" y="495" width="18" height="18" class="slot wait"/><text x="46" y="509" class="small">task #1: waits for EOPF-CPM</text>
  <rect x="260" y="495" width="18" height="18" class="slot work"/><text x="286" y="509" class="small">task #2: real computation</text>
  <rect x="480" y="495" width="18" height="18" class="slot queue"/><text x="506" y="509" class="small">waiting in the scheduler queue</text>
  <text x="20" y="540" class="small">A mitigation exists inside Dask (secede(): a task releases its thread while it waits), see the options in the page.</text>
</svg>
