adgs:
  auth:
    type: TokenAuth
    auth_uri: https://PLACEHOLDER/oauth2/token
    token_type: json
    token_key: access_token
    refresh_token_key: refresh_token
    token_expiration_key: expires_in
    request_method: POST
    req_data:
      client_id: PLACEHOLDER
      client_secret: PLACEHOLDER
      grant_type: PLACEHOLDER
      username: PLACEHOLDER
      password: PLACEHOLDER
    credentials:
      auth_for_token: PLACEHOLDER
    headers:
      Content-Type: application/x-www-form-urlencoded
    retrieve_headers:
      Content-Type: application/x-www-form-urlencoded
      Authorization: '{auth_for_token}'
  products:
    CAMS_GRF_AUX:
      productType: cams-ads-grf-aux

  search:
    type: ODataV4Search
    api_endpoint: {{ $.Values.app.station.adgs.endpoint }}
    need_auth: true
    results_entry: $.value
    metadata_mapping:
        id:
          - null
          - '$.Id'
        Name:
          - null
          - '$.Name'
        ContentLength:
          - null
          - '$.ContentLength'
        ContentType:
          - null
          - '$.ContentType'
        PublicationDate:
          - null
          - '$.PublicationDate'
        EvictionDate:
          - null
          - '$.EvictionDate'
        DatetimeStart:
          - null
          - "$.ContentDate.Start"
        Start:
          - null
          - '$.ContentDate.Start'
        End:
          - null
          - '$.ContentDate.End'
        StartPublicationDate:
          - null
          - '$.PublicationDate'
        StopPublicationDate:
          - null
          - '$.PublicationDate'
        ChecksumValue:
          - null
          - '$.Checksum[0].Value'
        attr_ptype:
          - null
          - '$.attr_ptype'
        attr_ptypes:
          - null
          - '$.attr_ptype'
        platformSerialIdentifier:
          - null
          - "$.platformSerialIdentifier"
        platformSerialIdentifiers:
          - null
          - "$.platformSerialIdentifier"
        platformShortName:
          - null
          - "$.platformShortName"
        platformShortNames:
          - null
          - "$.platformShortName"
        processingDate:
          - null
          - "$.processingDate"
        processingCenter:
          - null
          - "$.processingCenter"
        attrs:
          - null
          - '$.Attributes'
        href:
          - null
          - '{{ $.Values.app.station.adgs.endpoint }}({id})/$value'
        geometry: 'POLYGON((180 -90, 180 90, -180 90, -180 -90, 180 -90))'
        downloadLink: '{{ $.Values.app.station.adgs.endpoint }}({id})/$value'
        title: '$.Name'
        Names:
          - null
          - '$.Name'

    free_text_search_operations:
      $filter:
        union: ' OR '
        wrapper: '{}'
        operations:
            and:
              - contains(Name, '{Name}')
              - Name in ({Names})
              - (PublicationDate gt {StartPublicationDate#to_iso_utc_datetime} or PublicationDate eq {StartPublicationDate#to_iso_utc_datetime})
              - (PublicationDate lt {StopPublicationDate#to_iso_utc_datetime} or PublicationDate eq {StopPublicationDate#to_iso_utc_datetime})
              - PublicationDate eq {PublicationDate#to_iso_utc_datetime}
              - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'productType' and att/OData.CSC.StringAttribute/Value eq {attr_ptype})"
              - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'productType' and att/OData.CSC.StringAttribute/Value in ({attr_ptypes}))"
              - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'platformSerialIdentifier' and att/OData.CSC.StringAttribute/Value eq {platformSerialIdentifier})"
              - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'platformSerialIdentifier' and att/OData.CSC.StringAttribute/Value in ({platformSerialIdentifiers}))"
              - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'platformShortName' and att/OData.CSC.StringAttribute/Value eq {platformShortName#to_upper})"
              - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'platformShortName' and att/OData.CSC.StringAttribute/Value in ({platformShortNames#to_upper}))"
              - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'processingDate' and att/OData.CSC.StringAttribute/Value eq '{processing:datetime#to_iso_utc_datetime}')"
              - "Attributes/OData.CSC.StringAttribute/any(att:att/Name eq 'processingCenter' and att/OData.CSC.StringAttribute/Value eq '{processingCenter#to_iso_utc_datetime}')"
              - "ContentDate/Start gt {Start#to_iso_utc_datetime}"
              - "ContentDate/Start eq {DatetimeStart#to_iso_utc_datetime}"
              - "ContentDate/Stop lt {Stop#to_iso_utc_datetime}"
              - "{t_before}"
              - "{t_after}"
              - "{t_meets}"
              - "{t_metby}"
              - "{t_overlaps}"
              - "{t_overlappedby}"
              - "{t_starts}"
              - "{t_startedby}"
              - "{t_during}"
              - "{t_contains}"
              - "{t_finishes}"
              - "{t_finishedby}"
              - "{t_equals}"
              - "{t_disjoint}"
              - "{t_intersects}"
    pagination:
      max_items_per_page: 100
      next_page_url_tpl: '{url}?{search}&$top={items_per_page}&$skip={skip}&$expand=Attributes'
      total_items_nb_key_path: '$.total'
    sort:
      sort_by_tpl: '&$orderby={sort_param} {sort_order}'
      sort_param_mapping:
        id: Name
        file:size: ContentLength
        type: ContentType
        eviction_datetime: EvictionDate
        created: PublicationDate
        start_datetime: ContentDate/Start
        end_datetime: ContentDate/End
      sort_order_mapping:
        ascending: asc
        descending: desc
      max_sort_params: 1

  download:
    type: HTTPDownload
    base_uri: '{{ $.Values.app.station.adgs.endpoint }}'
    metadata_mapping:
        uid: '$.Id'
        downloadLink: '{{ $.Values.app.station.adgs.endpoint }}({uid})/$value'
