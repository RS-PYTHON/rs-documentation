apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  allowCrossNamespaceImport: true
  datasource:
    name: tempo
    type: tempo
    access: proxy
    url: http://tempo-distributed-query-frontend.logging.svc.cluster.local:3200
    isDefault: false
    jsonData:
      lokiSearch:
        datasourceUid: "Loki"
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: "Prometheus"
      tracesToLogsV2:
        datasourceUid: "Loki"
        filterBySpanID:	true
        filterByTraceID: true
        spanEndTimeShift: "1m"
        spanStartTimeShift: "-1m"
        tags:
          - key: "service.name"
            value: "service_name"
          - key: "pod"
            value: ""
      "tlsSkipVerify": true
      "timeInterval": "5s"
