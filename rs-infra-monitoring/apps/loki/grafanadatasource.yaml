apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  allowCrossNamespaceImport: true
  datasource:
    name: Loki
    type: loki
    access: proxy
    url: http://loki-query-frontend.logging.svc.cluster.local:3100
    isDefault: false
    jsonData:
      derivedFields:
        - name: "span_id"
          matcherRegex: "span_id=(\\w+)"
        - name: "trace_id"
          matcherRegex: "trace_id=(\\w+)"
          url: "${__value.raw}"
          datasourceUid: "tempo"
      "tlsSkipVerify": true
      "timeInterval": "5s"
