<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474F"/>
    </marker>
    <style>
      .title { font-size: 20px; font-weight: bold; fill: #263238; }
      .lane { stroke-width: 2; rx: 10; }
      .lanehead { font-size: 15px; font-weight: bold; fill: #263238; }
      .colhead { font-size: 12px; font-weight: bold; fill: #78909C; text-anchor: middle; }
      .box { stroke-width: 2; rx: 8; }
      .txt { fill: #263238; text-anchor: middle; }
      .bold { font-weight: bold; }
      .small { font-size: 11px; fill: #455A64; text-anchor: middle; }
      .link { stroke: #37474F; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .runner { fill: #FFE082; stroke: #F9A825; stroke-width: 2; rx: 6; }
    </style>
  </defs>

  <text x="550" y="30" text-anchor="middle" class="title">One runner, one launcher: cluster and local modes</text>

  <text x="125" y="60" class="colhead">rs-dpr-service</text>
  <text x="385" y="60" class="colhead">Kubernetes API</text>
  <text x="640" y="60" class="colhead">driver = runner + EOPF-CPM</text>
  <text x="920" y="60" class="colhead">Dask cluster</text>

  <!-- Lane 1: cluster mode -->
  <rect x="10" y="70" width="1080" height="170" class="lane" fill="#F9FDF9" stroke="#2E7D32"/>
  <text x="25" y="92" class="lanehead">Cluster mode (Kubernetes)</text>
  <rect x="25" y="110" width="200" height="110" class="box" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="125" y="140" class="txt bold">rs-dpr-service</text>
  <text x="125" y="158" class="small">KubernetesJobLauncher</text>
  <text x="125" y="174" class="small">in-cluster configuration</text>
  <text x="125" y="190" class="small">one generic Deployment</text>
  <rect x="285" y="110" width="200" height="110" class="box" fill="#ECEFF1" stroke="#455A64"/>
  <text x="385" y="140" class="txt bold">Kubernetes cluster</text>
  <text x="385" y="158" class="small">Job, Secret, pod logs, delete</text>
  <text x="385" y="174" class="small">RBAC and quotas (rs-helm)</text>
  <text x="385" y="190" class="small">driver node pool</text>
  <rect x="545" y="110" width="190" height="110" class="box" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="640" y="132" class="txt bold">Job pod</text>
  <rect x="560" y="142" width="160" height="62" class="runner"/>
  <text x="640" y="168" class="txt bold">runner</text>
  <text x="640" y="186" class="small">image of the cluster</text>
  <rect x="795" y="110" width="270" height="110" class="box" fill="#F3E5F5" stroke="#6A1B9A"/>
  <text x="930" y="136" class="txt bold">Dask cluster (pods)</text>
  <text x="930" y="156" class="small">Dask Gateway, JupyterHub auth</text>
  <text x="930" y="172" class="small">scheduler pod + worker pods</text>
  <text x="930" y="188" class="small">image from the cluster options</text>
  <path class="link" d="M 225 165 L 285 165"/>
  <path class="link" d="M 485 165 L 545 165"/>
  <path class="link" d="M 735 165 L 795 165"/>

  <!-- Lane 2: local mode -->
  <rect x="10" y="255" width="1080" height="210" class="lane" fill="#F5FAFF" stroke="#1565C0"/>
  <text x="25" y="277" class="lanehead">Local mode (docker compose + k3s)</text>
  <rect x="25" y="295" width="200" height="150" class="box" fill="#E3F2FD" stroke="#1565C0"/>
  <text x="125" y="325" class="txt bold">rs-dpr-service</text>
  <text x="125" y="343" class="small">same image, same</text>
  <text x="125" y="359" class="small">KubernetesJobLauncher</text>
  <text x="125" y="375" class="small">in-cluster configuration</text>
  <text x="125" y="391" class="small">(files from k3s-init)</text>
  <rect x="285" y="295" width="460" height="150" class="box" fill="#ECEFF1" stroke="#455A64"/>
  <text x="300" y="317" class="bold" fill="#263238">k3s container</text>
  <text x="385" y="345" class="small">Job, Secret, pod logs, delete</text>
  <text x="385" y="361" class="small">same RBAC and quotas</text>
  <text x="385" y="377" class="small">one node, privileged</text>
  <text x="385" y="393" class="small">own image store</text>
  <rect x="545" y="305" width="190" height="130" class="box" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="640" y="327" class="txt bold">Job pod</text>
  <rect x="560" y="337" width="160" height="62" class="runner"/>
  <text x="640" y="363" class="txt bold">runner</text>
  <text x="640" y="381" class="small">image dask-*/local</text>
  <text x="640" y="420" class="small">hostNetwork: on rspy-network</text>
  <rect x="795" y="295" width="270" height="150" class="box" fill="#F3E5F5" stroke="#6A1B9A"/>
  <text x="930" y="321" class="txt bold">dask-cpm3 container</text>
  <text x="930" y="341" class="small">own Dask Gateway (local backend)</text>
  <text x="930" y="357" class="small">basic auth</text>
  <text x="930" y="373" class="small">scheduler + workers = processes</text>
  <text x="930" y="389" class="small">image option = own image</text>
  <path class="link" d="M 225 370 L 285 370"/>
  <path class="link" d="M 485 370 L 545 370"/>
  <path class="link" d="M 735 370 L 795 370"/>

  <!-- Lane 3: debug -->
  <rect x="10" y="480" width="1080" height="170" class="lane" fill="#FFFBF0" stroke="#F9A825"/>
  <text x="25" y="502" class="lanehead">Debug (breakpoints in EOPF and the processor)</text>
  <rect x="25" y="520" width="460" height="110" class="box" fill="#FFF8E1" stroke="#F9A825"/>
  <text x="255" y="550" class="txt bold">developer IDE</text>
  <text x="255" y="568" class="small">no rs-dpr-service, no Kubernetes:</text>
  <text x="255" y="584" class="small">the runner is started by hand with a payload file</text>
  <rect x="545" y="520" width="190" height="110" class="box" fill="#FFF8E1" stroke="#F9A825"/>
  <text x="640" y="542" class="txt bold">IDE process</text>
  <rect x="560" y="552" width="160" height="62" class="runner"/>
  <text x="640" y="578" class="txt bold">runner</text>
  <text x="640" y="596" class="small">the same code</text>
  <rect x="795" y="520" width="270" height="110" class="box" fill="#F3E5F5" stroke="#6A1B9A"/>
  <text x="930" y="546" class="txt bold">dask-* container</text>
  <text x="930" y="566" class="small">(published gateway port)</text>
  <text x="930" y="590" class="txt bold">or LocalCluster</text>
  <text x="930" y="608" class="small">created by EOPF-CPM</text>
  <path class="link" d="M 485 575 L 545 575"/>
  <path class="link" d="M 735 575 L 795 575"/>
</svg>
