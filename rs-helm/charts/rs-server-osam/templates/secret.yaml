apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-obs
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  S3_ACCESSKEY: {{ .Values.obs.secret.ak | b64enc | quote }}
  S3_SECRETKEY: {{ .Values.obs.secret.sk | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-auth
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  OIDC_ENDPOINT: {{ .Values.auth.secret.oidc_endpoint | b64enc | quote }}
  OIDC_REALM: {{ .Values.auth.secret.oidc_realm | b64enc | quote }}
  OIDC_CLIENT_ID: {{ .Values.auth.secret.oidc_client_id | b64enc | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.auth.secret.oidc_client_secret | b64enc | quote }}
  RSPY_COOKIE_SECRET: {{ .Values.auth.secret.cookie_secret | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-provider-auth
  namespace: {{ .Values.namespace }}
type: Opaque
data:
  OVH_ENDPOINT: {{ .Values.provider.secret.ovh_endpoint | b64enc | quote }}
  OVH_APPLICATION_KEY: {{ .Values.provider.secret.ovh_application_key | b64enc | quote }}
  OVH_APPLICATION_SECRET: {{ .Values.provider.secret.ovh_application_secret | b64enc | quote }}
  OVH_CONSUMER_KEY: {{ .Values.provider.secret.ovh_consumer_key | b64enc | quote }}
  OVH_SERVICE: {{ .Values.provider.secret.ovh_service | b64enc | quote }}
