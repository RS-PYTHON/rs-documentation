site_name: RS-Python
#site_url: https://rs-python.github.io/rs-documentation/
# Copyright
copyright: Copyright &copy; 2024, ESA

theme:
  name: material
  custom_dir: docs/_templates
  features:    
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections    
    - navigation.top
    - navigation.tracking
    - navigation.indexes   
    - navigation.path   
    - toc.integrate
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en
  palette:
    - scheme: default
      toggle:
        icon: material/toggle-switch-off-outline 
        name: Switch to dark mode
      primary: teal
      accent: purple 
    - scheme: slate 
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode    
      primary: teal
      accent: lime
markdown_extensions:
  - sane_lists
  - admonition
  - pymdownx.details
  - pymdownx.superfences
extra_css: [_templates/sidebar_width.css]
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            extra:              
              separate_modules: true              
  # TODO: Add the spellchecker also? If yes, a lot of words should be added in the spellchecker_ignore.txt file
  # - spellcheck:      
  #     known_words: spellchecker_ignore.txt    
  #     # ignore words in <code> tags
  #     ignore_code: yes

  #     # minimum length of words to consider
  #     min_length: 2

  #     # maximum number of capital letters in a word
  #     max_capital: 1

  #     # keep unicode characters
  #     allow_unicode: no

  #     # skip files entirely (supports Unix shell-style wildcards)
  #     skip_files:
  #     - credits.md
  #     - coverage.md
  #     - reference/* 

  #     # whether to only check in strict mode
  #     strict_only: yes
