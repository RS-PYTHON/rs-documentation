prefect-version: "3"

pull:
- prefect.deployments.steps.git_clone:
    repository: https://github.com/RS-PYTHON/rs-client-libraries.git
    branch: develop # should be 'develop' in git

definitions:
    work_pools:
        prefect_work_pool_integrated: &prefect_work_pool_integrated
            name: "{{ PREFECT_WORK_POOL_INTEGRATED }}"
        prefect_work_pool_sandbox: &prefect_work_pool_sandbox
            name: "{{ PREFECT_WORK_POOL_SANDBOX }}"

deployments:
- name: Process Generic
  version: "todo-version"
  tags: ["dpr", "sprint 30"]
  work_pool: *prefect_work_pool_sandbox
  entrypoint: ./rs_workflows/on_demand_processing.py:dpr_processing

- name: Stage Auxip
  version: "todo-version"
  tags: ["dpr", "sprint 30"]
  work_pool: *prefect_work_pool_integrated
  entrypoint: ./rs_workflows/aux_flow.py:aux_staging

- name: Stage Cadip
  version: "todo-version"
  tags: ["dpr", "sprint 30"]
  work_pool: *prefect_work_pool_integrated
  entrypoint: ./rs_workflows/cadip_flow.py:on_demand_cadip_staging
